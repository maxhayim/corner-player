plugins {
    id 'com.android.application'
}

// SIGNING_PROPERTIES points at a signing.properties kept outside the repo (storeFile, storePassword, keyAlias,
// keyPassword). Unset, release builds are signed with the debug key.
def releaseKey = null
def signingPath = System.getenv('SIGNING_PROPERTIES')
if (signingPath != null && file(signingPath).exists()) {
    releaseKey = new Properties()
    file(signingPath).withInputStream { releaseKey.load(it) }
}

android {
    namespace 'io.github.maxhayim.cornerplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.maxhayim.cornerplayer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        if (releaseKey != null) {
            release {
                storeFile file(releaseKey['storeFile'])
                storePassword releaseKey['storePassword']
                keyAlias releaseKey['keyAlias']
                keyPassword releaseKey['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key lives outside the repo (see release.sh); without it, the debug key, as in CI.
            signingConfig releaseKey != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Media3, as TV Hub and Frigate Glance use: HLS and progressive streams, and RTSP for cameras.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    // Test only: plain JVM tests in src/test; org.json because android.jar's copy is a stub there.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
